.6Z" fill="url(#rwad-speed)"/><path d="M-5 35L13 33.4Q14.6 35 13 36.6Z" fill="url(#rwad-speed)"/></g></g><path class="boost" d="M1 63L15 42L24 50Z" fill="url(#rwad-boost)"/></g><g class="car"><g transform="translate(4 -1) rotate(-26 32 34) translate(32 34) scale(.86) translate(-32 -34)"><g mask="url(#rwad-arch)"><path d="M6.8 37.5L7.8 28.4Q8.1 26.8 9.7 26.8H21.5L25.8 30.4H40.5L56.8 33Q59.6 33.5 59.6 35.8L59.4 37.5Z" fill="#ffffff"/><path d="M14.5 26.8L21 17.2H31.2L41.5 30.4 M9.6 26.8V21.6" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-0.8 19.6L12.6 18.4Q13.6 18.3 13.6 19.3V20.6Q13.6 21.4 12.8 21.5L-0.2 22.7Q-1 22.8 -1 22Z" fill="#ffffff"/></g><g fill="#ffffff" mask="url(#rwad-rim)"><circle cx="17" cy="43.8" r="8.6"/><circle cx="49.5" cy="44.4" r="7.6"/></g></g></g></g></g>
