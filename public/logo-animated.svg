<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 320.6 72" width="320.6" height="72">
  <title>RocketWatchr</title>
  <style>
    /* Same choreography as the other Watchr logos: the speed lines draw in, the buggy launches,
       the boost lights up, the name rises; then the boost keeps flickering and the buggy hovers. */
    .speed { opacity: 0; transform: translateX(-8px); animation: slide .45s ease .1s forwards; }
    .car { opacity: 0; transform: translate(-8px, 6px); animation: launch .5s cubic-bezier(.3, 1.4, .5, 1) .3s forwards, hover 2.4s ease-in-out 1.2s infinite; }
    .boost { opacity: 0; transform-box: fill-box; transform-origin: 100% 0; animation: ignite .35s ease .65s forwards, flicker 1.6s ease-in-out 1s infinite; }
    .word { opacity: 0; animation: rise .5s ease .75s forwards; }
    @keyframes slide { to { opacity: 1; transform: none; } }
    @keyframes launch { to { opacity: 1; transform: none; } }
    @keyframes ignite { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
    @keyframes flicker { 0%, 100% { transform: none; } 30% { transform: scale(.84); } 55% { transform: scale(1.04); } 75% { transform: scale(.9); } }
    @keyframes hover { 0%, 100% { opacity: 1; transform: none; } 50% { opacity: 1; transform: translate(.6px, -1.6px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .speed, .car, .boost, .word { animation: none; opacity: 1; transform: none; } }
  </style>
